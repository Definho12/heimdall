name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.11.1" }
      - name: Baixar amostras reais (para os testes do leitor)
        continue-on-error: true
        run: |
          mkdir -p amostras
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          for r in sudeste sul nordeste norte centrooeste nacional; do
            curl -sL -A "$UA" --max-time 40 "https://www.pciconcursos.com.br/concursos/$r/" -o amostras/$r.html || true
          done
          N=$(grep -o 'https://www.pciconcursos.com.br/noticias/[a-z0-9-]*' amostras/sudeste.html | head -40 | sort -u | head -3)
          i=1; for u in $N; do curl -sL -A "$UA" --max-time 40 "$u" -o amostras/noticia$i.html; i=$((i+1)); done
          ls -la amostras
          mkdir -p app/src/test/resources && cp amostras/*.html app/src/test/resources/
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          { grep -E "^e: |error:|AssertionError|Test.*FAILED|expected" build.log; grep -A6 "What went wrong" build.log; tail -15 build.log; } | head -45 | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Guardar amostras no branch "amostras"
        if: always()
        continue-on-error: true
        run: |
          cp build.log amostras/ 2>/dev/null || true
          cp -r app/build/test-results amostras/ 2>/dev/null || true
          cp app/build/*.txt amostras/ 2>/dev/null || true
          cd amostras && git init -q -b amostras
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "amostras ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" amostras
      - name: Publish APK to the "apk" branch
        run: |
          mkdir out && cp app/build/outputs/apk/release/app-release.apk out/Heimdall.apk
          cd out && git init -q -b apk
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add Heimdall.apk && git commit -q -m "build ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
